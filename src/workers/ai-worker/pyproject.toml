[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-ai-worker"
version = "0.1.0"
description = "AI Shopping & Operations Assistant Worker Foundation (Python 3.12+ / FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "commerce-common",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv.sources]
commerce-common = { path = "../../building-blocks/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ai_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
