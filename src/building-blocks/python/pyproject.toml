[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-common"
version = "0.1.0"
description = "Shared Python 3.12+ cross-cutting building blocks for Distributed Commerce Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_common"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
